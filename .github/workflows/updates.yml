name: Update Nix Flakes

on:
  schedule:
    # Runs every Sunday at 08:00 UTC
    - cron: "0 8 * * 0"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write
  pull-requests: write
jobs:
  update-flakes-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-stable

      - name: Enable Flakes
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      - name: Update main branch
        run: |
          nix flake update
          git add flake.lock
          git commit -m "chore: update flake"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/main-generated-changes
          commit-message: "chore: update generated files"
          title: "chore(deps): update flake.lock (main)"
          body: "Automated flake update generated by GitHub Actions."
